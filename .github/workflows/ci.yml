name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q asr_calculator.py asr_enrichment_features.py cli.py tests

      - name: Run tests
        run: pytest -q

      - name: Verify CLI
        run: |
          python cli.py direct --input sample.csv --json
          python cli.py batch --input sample.csv --output out_smoke.csv

      - name: Verify browser JavaScript syntax
        run: node --check docs/app.js
